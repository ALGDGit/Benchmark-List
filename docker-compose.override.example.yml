# Optional compose overrides for benchmark comparisons
#
# Copy to docker-compose.override.yml and adjust.
#
# Disable Elasticsearch for search benchmark:
#
# services:
#   web:
#     environment:
#       FEATURE_ELASTICSEARCH: "0"
#
# Disable Redis activity log (file fallback only):
#
# services:
#   web:
#     environment:
#       FEATURE_REDIS_ACTIVITY: "0"
#
# Stop Varnish and expose Symfony on 8080 instead (advanced):
#   docker compose stop varnish
#   docker compose port web 80   # map host 8080 manually
